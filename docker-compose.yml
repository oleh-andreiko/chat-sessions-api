# PostgreSQL for the test task.
#
# Port 5433 (not the default 5432) on purpose: the n8n stack on this machine
# may already occupy 5432. The volume name is prefixed too, so nothing here
# can touch the n8n database.

services:
  db:
    image: postgres:16-alpine
    container_name: testtask-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5433:5432"
    volumes:
      - testtask_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  testtask_pgdata:
